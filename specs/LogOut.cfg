SPECIFICATION Spec

CONSTANTS
    \* every kind of request that runs the session's pending work checks the flag
    Checked = {"click", "logout", "poll", "page", "fragment"}
    \* two: a user may click Log out again while its job runs
    MaxJobs = 2
    \* a second Log out while the first one's job runs does nothing
    IgnoresUnderWay = TRUE

INVARIANTS
    TypeOK
    NoLeftoverFlag
    ClosedIsDropped
    FlagClearedAsThePageLeaves
    NoLogOutLeftBehind

PROPERTIES
    JobLogsOut
