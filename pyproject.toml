[build-system]
requires = ["setuptools>=61", "setuptools-scm[simple]>=9.2"]
build-backend = "setuptools.build_meta"

[project]
name = "composeui"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "El Hadi Moussi", email = "50993404+ehmoussi@users.noreply.github.com" },
]
requires-python = ">=3.9"
dependencies = ["attrs>=26.1.0", "qtpy>=2.4.3", "typing-extensions>=4.15.0"]
dynamic = ["version"]

[dependency-groups]
dev = ["mypy>=1.19.1", "pytest>=8.4.2", "pytest-coverage>=0.0", "ruff>=0.15.17"]
pyside6 = ["pyside6>=6.10.3"]


[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # ----- below are the rules that should be deactivated only for qt
    "ANN401",
    "ARG002",
    "FBT001",
    # --------- ignored for now
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D107",
    # --------- ignored for coherence
    "D203",
    "D213",
    "COM812",
    # --------- ignored
    "D105",
    "TD002",
    "TD003",
    "FIX002",
    "ERA001",
    "S101",
]
