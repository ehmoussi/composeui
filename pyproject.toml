[build-system]
requires = ["setuptools>=61", "setuptools-scm[simple]>=9.2"]
build-backend = "setuptools.build_meta"

[project]
name = "composeui"
description = "A framework-agnostic MVVM layer for building desktop UIs, with a Qt renderer"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "El Hadi Moussi", email = "50993404+ehmoussi@users.noreply.github.com" },
]
requires-python = ">=3.9"
keywords = ["mvvm", "gui", "qt", "pyside6", "attrs", "cattrs", "reactive"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Environment :: X11 Applications :: Qt",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: User Interfaces",
    "Typing :: Typed",
]
dependencies = [
    "attrs>=26.1.0",
    "cattrs>=25.3.0",
    "qtpy>=2.4.3",
    "typing-extensions>=4.15.0",
]
dynamic = ["version"]

[project.optional-dependencies]
pyside6 = ["pyqtgraph>=0.13.7", "pyside6>=6.10.3"]
tui = ["textual>=8.2.8", "textual-fspicker>=0.6.0", "textual-plotext>=1.0.1"]
web = [
    "itsdangerous>=2.2.0",
    "markdown-it-py>=3.0.0",
    "markupsafe>=3.0.2",
    "python-multipart>=0.0.20",
    "starlette>=0.49.3",
    "uvicorn>=0.39.0",
]
report = ["matplotlib>=3.9"]
reload = ["watchfiles>=1.1.1"]

[tool.setuptools.packages.find]
where = ["src"]
# `src/examples` is importable in a development install (the editable install puts `src`
# on the path) but is not part of the distribution
include = ["composeui*"]

[tool.setuptools.package-data]
"composeui.qtcore" = ["widgets/*.qml"]
"composeui.webcore" = ["static/*"]

[dependency-groups]
browser = ["playwright>=1.60.0"]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.19.1",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.1.0",
    "pytest-qt>=4.5.0",
    "pytest-xdist>=3.6.1",
    "ruff>=0.15.17",
    "textual-dev>=1.8.0",
    "watchfiles>=1.1.1",
]
docs = ["furo>=2024.8.6", "myst-parser>=3.0.1", "sphinx>=7.4.7"]
typecheck = [
    "mypy>=1.19.1",
    "pyrefly>=1.4.0",
    "pyright>=1.1.414",
    "ty>=0.0.92",
    "zuban>=0.10.1",
]


[tool.uv]
constraint-dependencies = ["certifi>=2026.10.19"]


[tool.mypy]
plugins = ["composeui.mypy"]
files = ["tests"]
always_false = ["PYQT5", "PYSIDE2", "PYQT6"]
always_true = ["PYSIDE6"]

[[tool.mypy.overrides]]
# pyqtgraph ships no type hints: the chart widget is typed at its edges
module = ["pyqtgraph", "pyqtgraph.*"]
ignore_missing_imports = true

[tool.pyrefly]
project-includes = ["tests/**/*.py"]
search-path = ["src", "."]
python-version = "3.9"
preset = "default"

[tool.pyright]
include = ["tests"]
extraPaths = ["src"]
pythonVersion = "3.9"
defineConstant = { PYQT5 = false, PYSIDE2 = false, PYQT6 = false, PYSIDE6 = true }

[tool.ty.environment]
python-version = "3.9"
extra-paths = ["src"]

[tool.ty.src]
include = ["tests"]

[tool.zuban]
mode = "mypy"

[tool.pytest.ini_options]
markers = [
    "browser: drives the web backend in a real browser (Playwright); run by `make browser-test`",
]
# a Qt warning fails the test: Qt reports a misuse of its API, such as a commit to a view
# that no longer has the editor, only in its log
qt_log_level_fail = "WARNING"
# the offscreen platform has no fonts or grab
qt_log_ignore = [
    "QFontDatabase",
    "Note that Qt no longer ships fonts",
    "QFont::setPointSizeF",
    "This plugin does not support",
]

[tool.coverage.run]
branch = true
# the reload tests run the apps in child processes
patch = ["subprocess"]

[tool.coverage.report]
# every line and branch: a new one comes with its test, or a pragma saying why
fail_under = 100
# lines that never run in a test; and, where COMPOSEUI_POSIX_ONLY is their mark (make.ps1
# sets it on Windows), lines that only POSIX runs
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "${COMPOSEUI_POSIX_ONLY-no line has this mark}",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "FA100",
    # ----- below are the rules that should be deactivated only for qt
    "ANN401",
    "ARG002",
    "FBT001",
    # --------- ignored for now
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D107",
    # --------- ignored for coherence
    "D203",
    "D213",
    "COM812",
    # --------- ignored
    "D105",
    "TD002",
    "TD003",
    "FIX002",
    "ERA001",
    "S101",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["composeui.core.sqlitemodel.csv_field"]

[tool.ruff.lint.flake8-type-checking]
# CSV schemas resolve attrs field annotations at runtime.
runtime-evaluated-decorators = ["attrs.define", "composeui.core.sqlitemodel.define_csv_row"]

[tool.ruff.lint.isort]
# Every module postpones annotation evaluation (enforced by I002, added by `make lint`).
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.pyupgrade]
# attrs/cattrs evaluate view field annotations at runtime, where `X | Y` fails on 3.9.
keep-runtime-typing = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]
# Sphinx loads the configuration and its extensions as scripts, not from a package
"docs/**" = ["INP001"]
# `qtbot` is requested but unused in tests that only need it for QApplication
# lifecycle/cleanup (see pytest-qt), not for driving an interaction.
"tests/test_qtrenderer.py" = ["ARG001"]
