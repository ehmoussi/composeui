[build-system]
requires = ["setuptools>=61", "setuptools-scm[simple]>=9.2"]
build-backend = "setuptools.build_meta"

[project]
name = "composeui"
description = "A framework-agnostic MVVM layer for building desktop UIs, with a Qt renderer"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "El Hadi Moussi", email = "50993404+ehmoussi@users.noreply.github.com" },
]
requires-python = ">=3.9"
keywords = ["mvvm", "gui", "qt", "pyside6", "attrs", "cattrs", "reactive"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Environment :: X11 Applications :: Qt",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: User Interfaces",
    "Typing :: Typed",
]
dependencies = [
    "attrs>=26.1.0",
    "cattrs>=25.3.0",
    "qtpy>=2.4.3",
    "typing-extensions>=4.15.0",
]
dynamic = ["version"]

[project.optional-dependencies]
pyside6 = ["pyside6>=6.10.3"]
tui = [
    "textual>=8.2.8",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.17",
    "textual-dev>=1.8.0",
]


[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "FA100",
    # ----- below are the rules that should be deactivated only for qt
    "ANN401",
    "ARG002",
    "FBT001",
    # --------- ignored for now
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D107",
    # --------- ignored for coherence
    "D203",
    "D213",
    "COM812",
    # --------- ignored
    "D105",
    "TD002",
    "TD003",
    "FIX002",
    "ERA001",
    "S101",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]
