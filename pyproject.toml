[build-system]
requires = ["setuptools>=61", "setuptools-scm[simple]>=9.2"]
build-backend = "setuptools.build_meta"

[project]
name = "composeui"
description = "A framework-agnostic MVVM layer for Python UIs: one app for Qt, Textual and the web"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "El Hadi Moussi", email = "50993404+ehmoussi@users.noreply.github.com" },
]
requires-python = ">=3.9"
keywords = ["mvvm", "gui", "qt", "pyside6", "textual", "tui", "web", "htmx", "attrs", "cattrs", "reactive"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Environment :: X11 Applications :: Qt",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: User Interfaces",
    "Typing :: Typed",
]
dependencies = [
    "attrs>=26.1.0",
    "cattrs>=25.3.0",
    "narwhals>=2.21.0",
    "typing-extensions>=4.15.0",
]
dynamic = ["version"]

[project.scripts]
composeui = "composeui.cli:main"

[project.urls]
Homepage = "https://github.com/ehmoussi/composeui"
Documentation = "https://ehmoussi.github.io/composeui/"
Source = "https://github.com/ehmoussi/composeui"
Issues = "https://github.com/ehmoussi/composeui/issues"
Changelog = "https://github.com/ehmoussi/composeui/blob/main/CHANGELOG.md"

[project.optional-dependencies]
pyside6 = ["pygments>=2.17", "pyqtgraph>=0.13.7", "pyside6>=6.10.3", "qtpy>=2.4.3"]
tui = ["pygments>=2.17", "textual>=8.2.8", "textual-fspicker>=0.6.0", "textual-plotext>=1.0.1"]
web = [
    "itsdangerous>=2.2.0",
    "markdown-it-py>=3.0.0",
    "markupsafe>=3.0.2",
    "pygments>=2.17",
    "python-multipart>=0.0.20",
    "starlette>=0.49.3",
    "uvicorn>=0.39.0",
]
report = ["matplotlib>=3.9"]
# images in pixels on Textual: it needs Python 3.12 or later
terminal-images = ["textual-image>=0.14.2; python_version >= '3.12'"]
reload = ["watchfiles>=1.1.1"]
# empty: Narwhals is now required; kept for one release so that `composeui[dataframe]` installs
dataframe = []

[tool.setuptools.packages.find]
where = ["src"]
# `src/examples` is importable in a development install (the editable install puts `src`
# on the path) but is not part of the distribution
include = ["composeui*"]

[tool.setuptools.package-data]
"composeui.qtcore" = ["widgets/*.qml"]
"composeui.webcore" = ["static/*"]

[dependency-groups]
browser = ["playwright>=1.60.0"]
dev = [
    # Starlette's test client: httpx2 replaces httpx, which is no longer maintained,
    # but needs Python 3.11
    "httpx>=0.28.1; python_version < '3.11'",
    "httpx2>=2.16.2; python_version >= '3.11'",
    "hypothesis>=6.141.1",
    "mypy>=1.19.1",
    "pandas>=2.3.3",
    "pandas-stubs>=2.2.2.240807",
    "polars>=1.36.1",
    "pyarrow>=21.0.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.1.0",
    "pytest-qt>=4.5.0",
    "pytest-repeat>=0.9.4",
    "pytest-xdist>=3.6.1",
    "ruff>=0.15.17",
    "types-pygments>=2.19.0",
    "watchfiles>=1.1.1",
]
# Textual's console for debugging an app (`textual console`): its own group, as it installs
# Textual, which the dev group must not, so that the tests run without the `tui` extra
textual-dev = ["textual-dev>=1.8.0"]
docs = [
    "furo>=2024.8.6",
    "myst-parser>=3.0.1",
    "sphinx>=7.4.7",
    "sphinx-sitemap>=2.9.0",
]
typecheck = [
    "mypy>=1.19.1",
    "pyrefly>=1.4.0",
    "pyright>=1.1.414",
    "ty>=0.0.92",
]


[tool.uv]
constraint-dependencies = ["certifi>=2026.10.19"]


[tool.mypy]
plugins = ["composeui.mypy"]
files = ["src/composeui", "src/examples", "tests"]
always_false = ["PYQT5", "PYSIDE2", "PYQT6"]
always_true = ["PYSIDE6"]
strict = true
# the typing tests check a snippet alone, which leaves the overrides below unused
warn_unused_configs = false
strict_bytes = true
local_partial_types = true
warn_unreachable = true
disallow_any_unimported = true
# pytest-qt leaves QtBot's key and mouse methods untyped, matplotlib its date helpers
untyped_calls_exclude = ["matplotlib", "pytestqt"]
enable_error_code = [
    "deprecated",
    "exhaustive-match",
    "explicit-override",
    "ignore-without-code",
    "possibly-undefined",
    "redundant-expr",
    "redundant-self",
    "truthy-bool",
    "truthy-iterable",
]

[[tool.mypy.overrides]]
# pyqtgraph ships no type hints: the chart widget is typed at its edges
module = ["pyqtgraph", "pyqtgraph.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# the chart widget and its tests pass around pyqtgraph's untyped classes
module = ["composeui.qtcore.widgets.qchart", "tests.qtcore.*"]
disallow_any_unimported = false

[[tool.mypy.overrides]]
# a test asserts a view's value, changes the view, then asserts it again: mypy keeps the
# first assert's narrowing, so the second looks unreachable or never equal. ty, which also
# checks the tests, doesn't narrow on a class held in a variable: the cast it needs is
# redundant for mypy
module = ["tests.*"]
warn_unreachable = false
strict_equality = false
disable_error_code = ["redundant-cast"]

[tool.pyrefly]
project-includes = ["tests/**/*.py"]
search-path = ["src", "."]
python-version = "3.9"
preset = "default"

[tool.pyright]
include = ["tests"]
extraPaths = ["src"]
pythonVersion = "3.9"
defineConstant = { PYQT5 = false, PYSIDE2 = false, PYQT6 = false, PYSIDE6 = true }

[tool.ty.environment]
python-version = "3.9"
extra-paths = ["src"]

[tool.ty.src]
include = ["tests"]

[tool.pytest.ini_options]
markers = [
    "browser: drives the web backend in a real browser (Playwright); run by `make browser-test`",
]
# a Qt warning fails the test: Qt reports a misuse of its API, such as a commit to a view
# that no longer has the editor, only in its log
qt_log_level_fail = "WARNING"
# the offscreen platform has no fonts or grab
qt_log_ignore = [
    "QFontDatabase",
    "Note that Qt no longer ships fonts",
    "QFont::setPointSizeF",
    "This plugin does not support",
    # macOS: how long Qt took to look up a font family, a timing note
    "Populating font family aliases",
]

[tool.coverage.run]
branch = true
# the reload tests run the apps in child processes
patch = ["subprocess"]

[tool.coverage.report]
# every line and branch: a new one comes with its test, or a pragma saying why
fail_under = 100
# lines that never run in a test; and, where COMPOSEUI_POSIX_ONLY is their mark (make.ps1
# sets it on Windows), lines that only POSIX runs; where COMPOSEUI_WINDOWS_ONLY is (the
# Makefile sets it), lines that only Windows runs
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "${COMPOSEUI_POSIX_ONLY-no line has this mark}",
    "${COMPOSEUI_WINDOWS_ONLY-no line has this mark}",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "FA100",
    # ----- below are the rules that should be deactivated only for qt
    "ANN401",
    "ARG002",
    "FBT001",
    # --------- ignored for now
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D107",
    # --------- ignored for coherence
    "D203",
    "D213",
    "COM812",
    # --------- ignored
    "D105",
    "TD002",
    "TD003",
    "FIX002",
    "ERA001",
    "S101",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["composeui.core.sqlitemodel.csv_field"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# A widget that hides under the pointer, such as a notification's close button, left its hand
# on WSLg's Wayland until the pointer moved. Qt's buttons show no hand: their hover is enough.
"qtpy.QtCore.Qt.CursorShape.PointingHandCursor".msg = "a hidden widget's hand cursor stays on Wayland: show the hover instead"
"qtpy.QtCore.Qt.PointingHandCursor".msg = "a hidden widget's hand cursor stays on Wayland: show the hover instead"

[tool.ruff.lint.flake8-type-checking]
# Views and CSV schemas resolve attrs field annotations at runtime.
runtime-evaluated-decorators = [
    "attrs.define",
    "attrs.frozen",
    "composeui.core._views.base.define_view",
    "composeui.core.sqlitemodel.define_csv_row",
]

[tool.ruff.lint.isort]
# Every module postpones annotation evaluation (enforced by I002, added by `make lint`).
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.pyupgrade]
# attrs/cattrs evaluate view field annotations at runtime, where `X | Y` fails on 3.9.
keep-runtime-typing = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]
# Sphinx loads the configuration and its extensions as scripts, not from a package
"docs/**" = ["INP001"]
# `qtbot` is requested but unused in tests that only need it for QApplication
# lifecycle/cleanup (see pytest-qt), not for driving an interaction.
"tests/qtcore/**" = ["ARG001"]
