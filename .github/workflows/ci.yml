name: CI

on:
  # pull requests cover every other branch; this avoids running twice per PR push
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # every version the classifiers in pyproject.toml promise
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - name: Install the system libraries offscreen Qt needs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --group dev --all-extras
      # `make lint` rewrites files; CI only verifies them
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: make mypy
      - run: make test

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      # the web extra only: these tests drive the web backend, nothing else
      - run: uv sync --locked --group dev --group browser --extra web
      - run: uv run playwright install --with-deps chromium
      - run: make browser-test
