name: CI

on:
  # pull requests cover every other branch; this avoids running twice per PR push
  push:
    branches: [main]
  pull_request:

jobs:
  # whether the push or pull request changes more than the documentation (docs/ and the
  # Markdown files): a change of the documentation only needs the docs job
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if ! git diff --name-only "$BASE...$HEAD" > changed.txt; then
            code=true  # nothing to compare with: check everything
          elif grep -qvE '^docs/|\.md$' changed.txt; then
            code=true
          else
            code=false
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # every version the classifiers in pyproject.toml promise
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - name: Install the system libraries offscreen Qt needs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --group dev --group browser --all-extras
      # `make lint` rewrites files; CI only verifies them
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: make mypy
      - run: make translations
      - run: make test

  typecheck:
    name: Typecheck (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: pyright
            experimental: false
          - target: pyrefly
            experimental: false
          - target: ty
            experimental: false
          # Zuban has known attrs and variadic-callback limitations.
          - target: zuban
            experimental: true
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          # Match the test checker configuration and the oldest supported Python.
          python-version: "3.9"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --group dev --group typecheck --group browser --all-extras
      - run: make ${{ matrix.target }}

  # the tests on Windows, through make.ps1: the lint and mypy don't depend on the system.
  # The oldest and newest versions only: the others behave as on Linux
  windows:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --group dev --all-extras
      - run: ./make.ps1 translations test

  # the tests on macOS, as on Windows: its Qt, its file paths (/tmp is /private/tmp) and its
  # make (GNU make 3.81)
  macos:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.14"]
    env:
      # uv's own Python, as on the other systems: the runner's Python 3.9 is Xcode's, whose
      # SQLite (Apple's) keeps a WAL's files and refuses to write its schema
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --group dev --all-extras
      - run: make translations test

  browser:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      # the web extra, and matplotlib for its charts' images: these tests drive the web
      # backend, nothing else
      - run: uv sync --locked --group dev --group browser --extra web --extra report
      - run: uv run playwright install --with-deps chromium
      - run: make browser-test

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # the API reference imports the Qt application module, which loads Qt's libraries
      - name: Install the system libraries Qt needs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      # every extra: the API reference imports each backend's application module
      - run: uv sync --locked --group docs --all-extras
      # the check job, which lints the whole repository, is skipped for a change of the
      # documentation only: its Python files (conf.py, _ext/, screenshots.py) are linted here
      - run: uv run ruff format --check docs
      - run: uv run ruff check docs
      - run: make docs
      # only main's site is published: a pull request just builds it
      - if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

  # the site the docs job built, on GitHub Pages
  pages:
    if: github.event_name == 'push'
    needs: docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # one deployment at a time, and a running one is never cut short
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
