name: Release

# A version tag (`v0.1.0`) publishes that version to PyPI. A manual run publishes the
# commit it runs on to TestPyPI, as a dry run: a development version, such as 0.1.dev12.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# one release at a time, and a running one is never cut short
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # the tests again, on the tagged commit: the agent skill's check needs the release's
  # version, which only the tag gives
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the tags: setuptools-scm makes the version from them
      - name: Install the system libraries offscreen Qt needs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --group dev --all-extras
      - run: make translations test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.13"
      - name: Build the sdist and the wheel
        env:
          # TestPyPI refuses a local version (0.1.dev12+g1a2b3c4): a dry run drops its part
          SETUPTOOLS_SCM_OVERRIDES_FOR_COMPOSEUI: >-
            ${{ github.ref_type != 'tag' && '{local_scheme = "no-local-version"}' || '' }}
        run: uv build
      - run: uvx twine check --strict dist/*
      - name: Check the version and its changelog entry
        if: github.ref_type == 'tag'
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ ! -f "dist/composeui-$version.tar.gz" ]; then
            echo "::error::The build isn't version $version:" dist/*
            exit 1
          fi
          if ! grep -qE "^## \[${version//./\\.}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no dated entry for $version (## [$version] - YYYY-MM-DD)"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    # Trusted Publishing: PyPI trusts this workflow and environment, no token is stored
    environment:
      name: pypi
      url: https://pypi.org/project/composeui/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/composeui/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  # the tag's GitHub release: its changelog entry, and the files PyPI has
  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## [$version]" \
            'index($0, heading) == 1 { found = 1; next } /^## |^\[.*\]: / { found = 0 } found' \
            CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md
