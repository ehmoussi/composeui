<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" role="img" aria-labelledby="title desc">
  <title id="title">How ComposeUI works</title>
  <desc id="desc">The app's views and its optional model are written once in composeui.core.
    Signals connect the views and the model. A study file saves the views' state as JSON,
    with the model's data when the model has some. A renderer of the chosen backend binds each view to a widget:
    setting a view attribute calls refresh_attribute, and a user edit calls update_state.
    The backend is Qt, Textual, or the web.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="head"/>
    </marker>
    <style>
      .card { fill: #ffffff; stroke: #d0d7de; }
      text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1f2937; }
      .muted { fill: #57606a; }
      .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
      .region { font-size: 13px; font-weight: 600; letter-spacing: 0.04em; fill: #57606a; }
      .title { font-size: 16px; font-weight: 600; }
      .small { font-size: 12px; }
      .core { fill: #eef2ff; stroke: #6366f1; }
      .core-inner { fill: #ffffff; stroke: #a5b4fc; }
      .model { fill: #fff7ed; stroke: #f59e0b; stroke-dasharray: 6 4; }
      .study { fill: #f6f8fa; stroke: #8c959f; }
      .renderer { fill: #f5f3ff; stroke: #8b5cf6; }
      .backend { fill: #ecfdf5; stroke: #10b981; }
      .line { stroke: #57606a; stroke-width: 1.6; fill: none; }
      .head { fill: #57606a; }
      .divider { stroke: #d0d7de; stroke-width: 1.5; stroke-dasharray: 6 5; }
      @media (prefers-color-scheme: dark) {
        .card { fill: #161b22; stroke: #30363d; }
        text { fill: #e6edf3; }
        .muted, .region { fill: #9198a1; }
        .core { fill: #1e1b4b; stroke: #818cf8; }
        .core-inner { fill: #161b22; stroke: #6366f1; }
        .model { fill: #3b2a10; stroke: #f59e0b; }
        .study { fill: #21262d; stroke: #6e7681; }
        .renderer { fill: #2e1065; stroke: #a78bfa; }
        .backend { fill: #052e1f; stroke: #34d399; }
        .line { stroke: #9198a1; }
        .head { fill: #9198a1; }
        .divider { stroke: #30363d; }
      }
    </style>
  </defs>

  <rect class="card" x="0.75" y="0.75" width="998.5" height="478.5" rx="12"/>

  <!-- the two regions -->
  <text class="region" x="24" y="34">YOUR APP, WRITTEN ONCE (composeui.core)</text>
  <text class="region" x="566" y="34">THE BACKEND, CHOSEN AT LAUNCH</text>
  <line class="divider" x1="546" y1="20" x2="546" y2="460"/>

  <!-- model -->
  <rect class="model" x="24" y="110" width="150" height="100" rx="8"/>
  <text class="title" x="99" y="140" text-anchor="middle">Model</text>
  <text class="small muted" x="99" y="158" text-anchor="middle" font-style="italic">optional</text>
  <text class="small muted" x="99" y="180" text-anchor="middle">the app's data</text>
  <text class="small muted mono" x="99" y="198" text-anchor="middle">SqliteModel</text>

  <!-- signals between the model and the views -->
  <line class="line" x1="178" y1="160" x2="246" y2="160" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="small" x="212" y="150" text-anchor="middle">Signals</text>

  <!-- saving and opening a study -->
  <line class="line" x1="99" y1="214" x2="99" y2="384" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="small mono" x="110" y="296">save_data</text>
  <text class="small mono" x="110" y="314">open_data</text>
  <line class="line" x1="385" y1="358" x2="385" y2="384" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="small mono" x="374" y="376" text-anchor="end">save_state / load_state</text>

  <rect class="study" x="24" y="388" width="496" height="64" rx="8"/>
  <text class="title" x="44" y="415">Study file</text>
  <text class="small muted" x="44" y="437">the views' state as JSON, plus the model's data if it has some</text>

  <!-- the view tree -->
  <rect class="core" x="250" y="54" width="270" height="300" rx="10"/>
  <text class="title" x="270" y="82">Views</text>
  <text class="small muted" x="270" y="100">typed attrs classes</text>
  <rect class="core-inner" x="270" y="114" width="230" height="222" rx="8"/>
  <text class="small mono" x="286" y="138">MainView</text>
  <rect class="core-inner" x="286" y="152" width="198" height="40" rx="6"/>
  <text class="small mono" x="300" y="177">InputView</text>
  <rect class="core-inner" x="286" y="202" width="198" height="40" rx="6"/>
  <text class="small mono" x="300" y="227">FormView</text>
  <rect class="core-inner" x="286" y="252" width="198" height="40" rx="6"/>
  <text class="small mono" x="300" y="277">TableView</text>
  <text class="small muted" x="300" y="318">…</text>

  <!-- views and renderer, both directions -->
  <line class="line" x1="520" y1="168" x2="662" y2="168" marker-end="url(#arrow)"/>
  <text class="small mono" x="592" y="158" text-anchor="middle">refresh_attribute</text>
  <line class="line" x1="664" y1="224" x2="522" y2="224" marker-end="url(#arrow)"/>
  <text class="small mono" x="592" y="244" text-anchor="middle">update_state</text>

  <!-- renderer -->
  <rect class="renderer" x="666" y="140" width="140" height="112" rx="8"/>
  <text class="title" x="736" y="172" text-anchor="middle">Renderer</text>
  <text class="small muted" x="736" y="194" text-anchor="middle">one per view,</text>
  <text class="small muted" x="736" y="212" text-anchor="middle">picked by its</text>
  <text class="small muted mono" x="736" y="230" text-anchor="middle">_renderer_key</text>

  <!-- backends -->
  <line class="line" x1="806" y1="180" x2="850" y2="104" marker-end="url(#arrow)"/>
  <line class="line" x1="806" y1="196" x2="850" y2="196" marker-end="url(#arrow)"/>
  <line class="line" x1="806" y1="212" x2="850" y2="288" marker-end="url(#arrow)"/>

  <rect class="backend" x="854" y="64" width="124" height="70" rx="8"/>
  <text class="title" x="916" y="94" text-anchor="middle">Qt</text>
  <text class="small muted" x="916" y="114" text-anchor="middle">a desktop window</text>

  <rect class="backend" x="854" y="161" width="124" height="70" rx="8"/>
  <text class="title" x="916" y="191" text-anchor="middle">Textual</text>
  <text class="small muted" x="916" y="211" text-anchor="middle">a terminal</text>

  <rect class="backend" x="854" y="258" width="124" height="70" rx="8"/>
  <text class="title" x="916" y="288" text-anchor="middle">The web</text>
  <text class="small muted" x="916" y="308" text-anchor="middle">a browser page</text>
</svg>
