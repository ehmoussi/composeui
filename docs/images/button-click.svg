<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" aria-labelledby="title desc">
  <title id="title">A button click on every backend</title>
  <desc id="desc">On Qt, Qt's clicked signal calls _emit_clicked. On Textual, ComposeButton.on_button_pressed
    emits its clicked signal. On the web, htmx posts the click and WebButtonRenderer.dispatch handles it.
    Each emits the view's clicked signal. In composeui.core, the signal runs the callback, which sets
    label.text, and notify_renderer calls refresh_attribute. The label's handler then calls QLabel.setText
    on Qt, Label.update on Textual, and _mark_dirty on the web, whose response sends the fragment.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="head"/>
    </marker>
    <style>
      .card { fill: #ffffff; stroke: #d0d7de; }
      text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1f2937; font-size: 12px; }
      .muted { fill: #57606a; }
      .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 11.5px; }
      .region { font-size: 13px; font-weight: 600; letter-spacing: 0.04em; fill: #57606a; }
      .title { font-size: 13px; font-weight: 600; }
      .step { font-size: 11px; font-weight: 700; fill: #ffffff; }
      .dot { fill: #6366f1; }
      .core { fill: #eef2ff; stroke: #6366f1; }
      .core-inner { fill: #ffffff; stroke: #a5b4fc; }
      .backend { fill: #ecfdf5; stroke: #10b981; }
      .line { stroke: #57606a; stroke-width: 1.6; fill: none; }
      .head { fill: #57606a; }
      @media (prefers-color-scheme: dark) {
        .card { fill: #161b22; stroke: #30363d; }
        text { fill: #e6edf3; }
        .muted, .region { fill: #9198a1; }
        .step { fill: #ffffff; }
        .core { fill: #1e1b4b; stroke: #818cf8; }
        .core-inner { fill: #161b22; stroke: #6366f1; }
        .backend { fill: #052e1f; stroke: #34d399; }
        .line { stroke: #9198a1; }
        .head { fill: #9198a1; }
      }
    </style>
  </defs>

  <rect class="card" x="0.75" y="0.75" width="998.5" height="418.5" rx="12"/>

  <!-- the three regions -->
  <circle class="dot" cx="30" cy="38" r="10"/><text class="step" x="30" y="42" text-anchor="middle">1</text>
  <text class="region" x="48" y="43">THE CLICK REACHES clicked</text>
  <text class="region" x="500" y="43" text-anchor="middle">composeui.core, ON EVERY BACKEND</text>
  <circle class="dot" cx="710" cy="38" r="10"/><text class="step" x="710" y="42" text-anchor="middle">4</text>
  <text class="region" x="728" y="43">THE LABEL SHOWS THE VALUE</text>

  <!-- 1: each backend's click -->
  <rect class="backend" x="20" y="80" width="280" height="64" rx="8"/>
  <text class="title" x="160" y="104" text-anchor="middle">Qt</text>
  <text class="mono" x="160" y="126" text-anchor="middle">QPushButton.clicked → _emit_clicked</text>

  <rect class="backend" x="20" y="180" width="280" height="64" rx="8"/>
  <text class="title" x="160" y="204" text-anchor="middle">Textual</text>
  <text class="mono" x="160" y="226" text-anchor="middle">ComposeButton.on_button_pressed</text>

  <rect class="backend" x="20" y="280" width="280" height="64" rx="8"/>
  <text class="title" x="160" y="304" text-anchor="middle">The web</text>
  <text class="mono" x="160" y="326" text-anchor="middle">POST /widget/{id} → dispatch()</text>

  <!-- the shared path -->
  <rect class="core" x="360" y="64" width="280" height="296" rx="10"/>

  <rect class="core-inner" x="380" y="84" width="240" height="56" rx="6"/>
  <text class="title" x="500" y="106" text-anchor="middle">ButtonView</text>
  <text class="mono" x="500" y="126" text-anchor="middle">clicked.emit()</text>

  <circle class="dot" cx="380" cy="186" r="10"/><text class="step" x="380" y="190" text-anchor="middle">2</text>
  <rect class="core-inner" x="400" y="184" width="220" height="56" rx="6"/>
  <text class="title" x="510" y="206" text-anchor="middle">the app's callback</text>
  <text class="mono" x="510" y="226" text-anchor="middle">label.text = "Done"</text>

  <circle class="dot" cx="380" cy="286" r="10"/><text class="step" x="380" y="290" text-anchor="middle">3</text>
  <rect class="core-inner" x="400" y="284" width="220" height="56" rx="6"/>
  <text class="mono" x="510" y="306" text-anchor="middle">notify_renderer →</text>
  <text class="mono" x="510" y="326" text-anchor="middle">refresh_attribute("text")</text>

  <line class="line" x1="500" y1="140" x2="500" y2="182" marker-end="url(#arrow)"/>
  <line class="line" x1="510" y1="240" x2="510" y2="282" marker-end="url(#arrow)"/>

  <!-- into the core -->
  <path class="line" d="M300,112 L378,112" marker-end="url(#arrow)"/>
  <path class="line" d="M300,212 C340,212 340,124 378,124" marker-end="url(#arrow)"/>
  <path class="line" d="M300,312 C350,312 340,132 378,132" marker-end="url(#arrow)"/>

  <!-- 4: each backend's handler -->
  <rect class="backend" x="700" y="80" width="280" height="64" rx="8"/>
  <text class="title" x="840" y="104" text-anchor="middle">Qt</text>
  <text class="mono" x="840" y="126" text-anchor="middle">QLabel.setText(), signals blocked</text>

  <rect class="backend" x="700" y="180" width="280" height="64" rx="8"/>
  <text class="title" x="840" y="204" text-anchor="middle">Textual</text>
  <text class="mono" x="840" y="226" text-anchor="middle">Label.update(), on the app's thread</text>

  <rect class="backend" x="700" y="280" width="280" height="64" rx="8"/>
  <text class="title" x="840" y="304" text-anchor="middle">The web</text>
  <text class="mono" x="840" y="326" text-anchor="middle">_mark_dirty → fragment in response</text>

  <!-- out of the core -->
  <path class="line" d="M620,304 C660,304 650,112 698,112" marker-end="url(#arrow)"/>
  <path class="line" d="M620,312 C665,312 655,212 698,212" marker-end="url(#arrow)"/>
  <path class="line" d="M620,320 L698,312" marker-end="url(#arrow)"/>

  <!-- the caption -->
  <text class="muted" x="500" y="396" text-anchor="middle">Steps 1 and 4 are the backend's renderers. Steps 2 and 3 are the same code on every backend.</text>
</svg>
